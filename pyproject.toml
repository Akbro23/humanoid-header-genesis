[project]
name = "humanoid-header-genesis"
version = "0.1.0"
description = "H1-2 keyframe header of an incoming cross, CMA-ES over batched Genesis rollouts"
readme = "README.md"
authors = [
    { name = "Akbro23", email = "atokochev@gmail.com" }
]
requires-python = ">=3.12,<3.14"
dependencies = [
    "cma>=4.0.0",
    "genesis-world==1.4.1",
    "matplotlib>=3.9",
    "scipy>=1.14",
    "torch>=2.8",
]

[project.scripts]
header = "humanoid_header_genesis.cli:main"

[build-system]
requires = ["uv_build>=0.8.7,<0.9.0"]
build-backend = "uv_build"
